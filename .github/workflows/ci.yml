name: CI

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Test
        env:
          JWT_SECRET: ci-test-secret-not-for-prod-0123456789abcdef
        run: ./mvnw -B -ntp test
